    <text x="100" y="28" class="entity-text">operational_comment</text>
  </g>

  <!-- 5. Supplier Ingest Invoice Entity -->
  <g transform="translate(260, 750)">
    <rect width="180" height="45" class="entity-box"/>
    <text x="90" y="28" class="entity-text">supplier_invoice</text>
  </g>

