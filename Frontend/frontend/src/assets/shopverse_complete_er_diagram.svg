<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1450" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      <![CDATA[
      /* Canvas and Typography Styles */
      .title { fill: #ffd54f; font-size: 32px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #8be9fd; font-size: 16px; text-anchor: middle; font-style: italic; }
      
      /* Entity Boxes */
      .entity-box { fill: #1a1c23; stroke: #ff79c6; stroke-width: 2.5; rx: 5; }
      .entity-text { fill: #ffffff; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .weak-entity-box { fill: #1a1c23; stroke: #ff79c6; stroke-width: 2; rx: 5; }
      
      /* Relationship Diamonds */
      .rel-diamond { fill: #1a1c23; stroke: #f1fa8c; stroke-width: 2; }
      .rel-text { fill: #f1fa8c; font-size: 12px; font-weight: bold; font-style: italic; text-anchor: middle; }
      
      /* Attributes Ovals */
      .attr-oval { fill: #0f2b2d; stroke: #8be9fd; stroke-width: 1.5; }
      .attr-text { fill: #8be9fd; font-size: 11px; text-anchor: middle; }
      
      /* Key Attributes (Underlined Green) */
      .attr-key { fill: #0f2b2d; stroke: #50fa7b; stroke-width: 2.5; }
      .attr-key-text { fill: #50fa7b; font-size: 11px; font-weight: bold; text-anchor: middle; text-decoration: underline; }
      
      /* Derived Attributes (Dashed Cyan) */
      .attr-derived { fill: #0f2b2d; stroke: #8be9fd; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .attr-derived-text { fill: #8be9fd; font-size: 11px; font-style: italic; text-anchor: middle; }
      
      /* Connecting Lines */
      .link-line { stroke: #6272a4; stroke-width: 1.5; }
      .ident-line { stroke: #ff79c6; stroke-width: 2.5; }
      ]]>
    </style>
  </defs>

  <!-- Main Title Block -->
  <text x="1050" y="45" class="title">Shop-Verse Management System - Complete Enterprise ERD</text>
  <text x="1050" y="75" class="subtitle">Data Model with Direct User Operations, Multi-Tenant Hierarchy, and Transaction Logistics</text>

  <!-- ==================== CONNECTOR LINES ==================== -->
  
  <!-- COMPANY CONNECTIONS -->
  <line x1="1050" y1="130" x2="1050" y2="180" class="link-line"/> <!-- to owns_catalog -->
  <line x1="1050" y1="130" x2="600" y2="180" class="link-line"/>  <!-- to works_for -->
  <line x1="1050" y1="130" x2="400" y2="450" class="link-line"/>  <!-- to company_ingests -->
  <line x1="1050" y1="130" x2="1000" y2="450" class="link-line"/> <!-- to company_sales -->
  
  <!-- Company Attribute Links -->
  <line x1="1050" y1="130" x2="900" y2="100" class="link-line"/>
  <line x1="1050" y1="130" x2="1050" y2="90" class="link-line"/>
  <line x1="1050" y1="130" x2="1200" y2="100" class="link-line"/>

  <!-- USER CONNECTIONS -->
  <line x1="600" y1="220" x2="320" y2="280" class="link-line"/>
  <line x1="395" y1="302" x2="885" y2="300" class="link-line"/> <!-- to manages (User -> Inventory) -->
  <line x1="320" y1="325" x2="200" y2="520" class="link-line"/> <!-- to processes_ingest -->
  <line x1="320" y1="325" x2="600" y2="520" class="link-line"/> <!-- to processes_sale -->
  <line x1="320" y1="325" x2="830" y2="600" class="link-line"/> <!-- to authors (User -> Operational Comment) -->
  
  <!-- User Attribute Links -->
  <line x1="320" y1="325" x2="120" y2="250" class="link-line"/>
  <line x1="320" y1="325" x2="230" y2="220" class="link-line"/>
  <line x1="320" y1="325" x2="380" y2="220" class="link-line"/>
  <line x1="320" y1="325" x2="110" y2="310" class="link-line"/>
  <line x1="320" y1="325" x2="110" y2="370" class="link-line"/>

  <!-- INVENTORY ITEM CONNECTIONS -->
  <line x1="1050" y1="220" x2="1650" y2="280" class="link-line"/>
  <line x1="1015" y1="300" x2="1560" y2="302" class="link-line"/> <!-- from manages -->
  <line x1="1650" y1="325" x2="1500" y2="520" class="link-line"/> <!-- to has_comment -->
  
  <!-- Inventory Item Attribute Links -->
  <line x1="1650" y1="325" x2="1450" y2="260" class="link-line"/>
  <line x1="1650" y1="325" x2="1450" y2="310" class="link-line"/>
  <line x1="1650" y1="325" x2="1450" y2="360" class="link-line"/>
  <line x1="1650" y1="325" x2="1550" y2="210" class="link-line"/>
  <line x1="1650" y1="325" x2="1680" y2="210" class="link-line"/>
  <line x1="1650" y1="325" x2="1810" y2="210" class="link-line"/>
  <line x1="1650" y1="325" x2="1920" y2="260" class="link-line"/>
  <line x1="1650" y1="325" x2="1940" y2="310" class="link-line"/>
  <line x1="1650" y1="325" x2="1940" y2="360" class="link-line"/>
  <line x1="1650" y1="325" x2="1920" y2="410" class="link-line"/>
  <line x1="1650" y1="325" x2="1820" y2="440" class="link-line"/>
  <line x1="1650" y1="325" x2="1680" y2="440" class="link-line"/>

  <!-- OPERATIONAL COMMENT CONNECTIONS -->
  <line x1="1500" y1="560" x2="1500" y2="630" class="link-line"/>
  <line x1="970" y1="600" x2="1400" y2="652" class="link-line"/> <!-- from authors -->
  
  <!-- Operational Comment Attribute Links -->
  <line x1="1500" y1="652" x2="1280" y2="610" class="link-line"/>
  <line x1="1500" y1="652" x2="1280" y2="660" class="link-line"/>
  <line x1="1500" y1="652" x2="1310" y2="710" class="link-line"/>
  <line x1="1500" y1="652" x2="1710" y2="610" class="link-line"/>
  <line x1="1500" y1="652" x2="1710" y2="660" class="link-line"/>

  <!-- SUPPLIER INVOICE LOG CONNECTIONS -->
  <line x1="200" y1="560" x2="350" y2="750" class="link-line"/>
  <line x1="400" y1="490" x2="350" y2="750" class="link-line"/>
  
  <!-- Supplier Invoice Attribute Links -->
  <line x1="350" y1="772" x2="150" y2="710" class="link-line"/>
  <line x1="350" y1="772" x2="150" y2="770" class="link-line"/>
  <line x1="350" y1="772" x2="170" y2="830" class="link-line"/>
  <line x1="350" y1="772" x2="350" y2="850" class="link-line"/>
  <line x1="350" y1="772" x2="520" y2="830" class="link-line"/>

  <!-- SALES INVOICE CONNECTIONS -->
  <line x1="600" y1="560" x2="850" y2="750" class="link-line"/>
  <line x1="1000" y1="490" x2="850" y2="750" class="link-line"/>
  <line x1="850" y1="795" x2="850" y2="950" class="ident-line"/> <!-- to has_line_item -->

  <!-- Sales Invoice Attribute Links -->
  <line x1="850" y1="772" x2="680" y2="710" class="link-line"/>
  <line x1="850" y1="772" x2="680" y2="760" class="link-line"/>
  <line x1="850" y1="772" x2="680" y2="810" class="link-line"/>
  <line x1="850" y1="772" x2="720" y2="860" class="link-line"/>
  <line x1="850" y1="772" x2="850" y2="870" class="link-line"/>
  <line x1="850" y1="772" x2="1000" y2="860" class="link-line"/>
  <line x1="850" y1="772" x2="1050" y2="810" class="link-line"/>

