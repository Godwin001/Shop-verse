  <g transform="translate(750, 1150)">
    <rect width="200" height="45" class="weak-entity-box"/>
    <rect x="4" y="4" width="192" height="37" class="weak-entity-box"/>
    <text x="100" y="27" class="entity-text">sales_line_item</text>
  </g>

  <!-- ==================== RELATIONSHIPS (DIAMONDS) ==================== -->
  
  <!-- works_for -->
  <g transform="translate(600, 200)">
    <polygon points="0,-25 65,0 0,25 -65,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">works_for</text>
  </g>

  <!-- owns_catalog -->
  <g transform="translate(1050, 200)">
    <polygon points="0,-25 75,0 0,25 -75,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">owns_catalog</text>
  </g>

  <!-- manages (NEW DIRECT LINK: user -> inventory_item) -->
  <g transform="translate(950, 300)">
    <polygon points="0,-25 65,0 0,25 -65,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">manages</text>
  </g>

  <!-- authors (NEW DIRECT LINK: user -> operational_comment) -->
  <g transform="translate(900, 600)">
    <polygon points="0,-25 70,0 0,25 -70,0" class="rel-diamond"/>
