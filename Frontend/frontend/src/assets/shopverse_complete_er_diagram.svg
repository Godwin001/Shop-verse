  </g>

  <!-- company_sales -->
  <g transform="translate(1000, 470)">
    <polygon points="0,-25 75,0 0,25 -75,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">company_sales</text>
  </g>

  <!-- processes_ingest -->
  <g transform="translate(200, 540)">
    <polygon points="0,-25 80,0 0,25 -80,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">processes_ingest</text>
  </g>

  <!-- processes_sale -->
  <g transform="translate(600, 540)">
    <polygon points="0,-25 75,0 0,25 -75,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">processes_sale</text>
  </g>

  <!-- has_comment -->
  <g transform="translate(1500, 540)">
    <polygon points="0,-25 70,0 0,25 -70,0" class="rel-diamond"/>
    <text x="0" y="4" class="rel-text">has_comment</text>
  </g>

