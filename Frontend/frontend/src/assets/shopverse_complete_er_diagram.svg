  <line x1="850" y1="1172" x2="1150" y2="1160" class="link-line"/>

  <!-- ==================== ENTITIES (RECTANGLES) ==================== -->
  
  <!-- 1. Company Entity -->
  <g transform="translate(970, 110)">
    <rect width="160" height="45" class="entity-box"/>
    <text x="80" y="28" class="entity-text">company</text>
  </g>

  <!-- 2. User Entity -->
  <g transform="translate(245, 280)">
    <rect width="150" height="45" class="entity-box"/>
    <text x="75" y="28" class="entity-text">user</text>
  </g>

  <!-- 3. Inventory Item Entity -->
  <g transform="translate(1560, 280)">
