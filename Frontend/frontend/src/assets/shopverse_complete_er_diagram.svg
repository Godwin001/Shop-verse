  <g transform="translate(1450, 360)"><ellipse cx="0" cy="0" rx="50" ry="16" class="attr-oval"/><text x="0" y="4" class="attr-text">item_name</text></g>
  <g transform="translate(1550, 210)"><ellipse cx="0" cy="0" rx="45" ry="16" class="attr-oval"/><text x="0" y="4" class="attr-text">supplier</text></g>
  <g transform="translate(1680, 210)"><ellipse cx="0" cy="0" rx="60" ry="16" class="attr-oval"/><text x="0" y="4" class="attr-text">invoice_number</text></g>
